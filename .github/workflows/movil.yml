# Prueba y compila la app de Android (movil/) cuando cambia. El APK queda como
# artefacto de la corrida (Sokari-apk) para instalarlo en el celular.
name: App del celular

on:
  push:
    branches: ['**']
    paths: ['movil/**', '.github/workflows/movil.yml']
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: movil
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Dependencias
        run: flutter pub get

      - name: Análisis (una advertencia cuenta como error)
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Pruebas
        run: flutter test

      - name: Compilar el APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: Sokari-apk
          path: movil/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
