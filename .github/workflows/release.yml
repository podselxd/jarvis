# Crea el release de una versión: compila y prueba en Windows y la app de
# Android, revisa que la versión coincida con el código y crea el release con
# Sokari.exe y Sokari.apk adjuntos. El actualizador solo ve releases publicados
# y solo baja Sokari.exe.
#
# Dos formas de lanzarlo:
# - Subir un tag vX.Y.Z: queda como BORRADOR para que lo publiques a mano.
# - Actions -> Borrador de release -> Run workflow, sobre master: escribes la
#   versión y eliges si sale publicado de una vez. Crea el tag él mismo.
name: Borrador de release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión (vX.Y.Z), la misma que tiene el código en master'
        required: true
        type: string
      publicar:
        description: 'Publicarlo de una vez (si no, queda como borrador)'
        required: false
        type: boolean
        default: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: v
        name: La versión coincide con el código
        env:
          ENTRADA: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            tag="$ENTRADA"
            if [ "$GITHUB_REF" != refs/heads/master ]; then
              echo "::error::Córrelo sobre master (se lanzó sobre $GITHUB_REF)."
              exit 1
            fi
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1 || gh release view "$tag" >/dev/null 2>&1; then
              echo "::error::Ya existe $tag: sube la versión en el código antes de crear otro release."
              exit 1
            fi
          else
            tag="$GITHUB_REF_NAME"
          fi
          sh tests/check_version.sh "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  compilar:
    needs: version
    uses: ./.github/workflows/compilar.yml

  movil:
    needs: version
    uses: ./.github/workflows/movil.yml
    with:
      version: ${{ needs.version.outputs.tag }}
    secrets: inherit

  borrador:
    needs: [version, compilar, movil]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: Sokari-exe
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: Sokari-apk
          path: dist

      - name: Crear el release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          PUBLICAR: ${{ inputs.publicar }}
        run: |
          sha256sum dist/Sokari.exe dist/Sokari.apk
          args=(--title "Sokari $TAG" --generate-notes)
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            args+=(--target "$GITHUB_SHA")
          else
            args+=(--verify-tag)
          fi
          if [ "$PUBLICAR" != true ]; then args+=(--draft); fi
          gh release create "$TAG" dist/Sokari.exe dist/Sokari.apk "${args[@]}"
